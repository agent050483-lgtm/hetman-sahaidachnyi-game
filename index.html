<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Гетьман Сагайдачний — Платформер</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 12px;
      background: #142219;
      color: #f6eedc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .game-shell {
      width: 100%;
      max-width: 980px;
      background: #1a2c20;
      border: 2px solid #c99a3a;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .hud-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      background: rgba(15, 26, 19, 0.85);
      border: 1px solid rgba(201, 154, 58, 0.45);
      border-radius: 12px;
      padding: 10px 14px;
    }
    .title-badge {
      font-weight: 800;
      font-size: 1.15rem;
      color: #ffd369;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .level-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .lvl-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #c99a3a;
      background: #273d2d;
      color: #f6eedc;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .lvl-btn.active {
      background: #c99a3a;
      color: #162219;
    }
    .stats-row {
      display: flex;
      gap: 14px;
      font-weight: 700;
      font-size: 1rem;
      align-items: center;
    }
    .canvas-wrap {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #d4a64a;
      background: #67a8e6;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      touch-action: none;
    }
    /* Трохи збільшені кнопки керування */
    .controls-panel {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .move-group, .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .ctrl-btn {
      min-height: 58px;
      min-width: 76px;
      padding: 12px 20px;
      border-radius: 14px;
      border: 2px solid #d4a64a;
      background: #253b2c;
      color: #fff6e0;
      font-size: 1.12rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 0 #132017;
      transition: transform 0.06s ease, background 0.12s ease;
    }
    .ctrl-btn:active, .ctrl-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #132017;
      background: #385842;
    }
    .ctrl-btn.saber {
      background: #6e2727;
      border-color: #e06c6c;
    }
    .ctrl-btn.knife {
      background: #24476e;
      border-color: #6ea8e5;
    }
    .hints {
      margin-top: 10px;
      font-size: 0.92rem;
      color: #d6cbb2;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud-top">
      <div class="title-badge">⚔️ Гетьман Сагайдачний</div>
      <div class="level-buttons">
        <button class="lvl-btn active" id="btnLvl1" onclick="setLevel(1)">Рівень 1 · Кам'янець</button>
        <button class="lvl-btn" id="btnLvl2" onclick="setLevel(2)">Рівень 2 · Хотин</button>
      </div>
      <div class="stats-row">
        <span id="statMaces">🔱 0/8</span>
        <span id="statKnives">🗡️ 5</span>
        <span id="statHp">❤️ 5</span>
        <span id="statScore">⭐ 0</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>

    <div class="controls-panel">
      <div class="move-group">
        <button class="ctrl-btn" id="btnLeft" aria-label="Вліво">◀</button>
        <button class="ctrl-btn" id="btnRight" aria-label="Вправо">▶</button>
      </div>
      <div class="action-group">
        <button class="ctrl-btn" id="btnJump">▲ Стрибок ×2</button>
        <button class="ctrl-btn saber" id="btnSaber">⚔️ Шабля</button>
        <button class="ctrl-btn knife" id="btnKnife">🗡️ Ніж</button>
      </div>
    </div>

    <div class="hints">
      ПК: <b>A/D</b> або <b>◀/▶</b> — рух · <b>W/▲/Space</b> — стрибок та подвійний стрибок · <b>J/Z</b> — шабля · <b>K/X/Enter</b> — кинути ніж · <b>R</b> — рестарт
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const WORLD_WIDTH = 2200;
    const VIEW_WIDTH = canvas.width;
    const VIEW_HEIGHT = canvas.height;
    const GROUND_Y = 430;
    const GRAVITY = 1550;

    // Трохи збільшений герой із жорстко зафіксованими пропорціями
    // Поворот працює через scale(hero.facing, 1) — пропорції при розвороті НЕ змінюються
    const HERO_BASE_HEIGHT = 104;
    const HERO_ASPECT_RATIO = 56 / 92;
    const HERO_WIDTH = Math.round(HERO_BASE_HEIGHT * HERO_ASPECT_RATIO);
    const HERO_HEIGHT = HERO_BASE_HEIGHT;

    // Підтримка власного спрайта героя з репозиторію (наприклад, sahaidachnyi.png або hero.png)
    const SPRITE_CANDIDATES = ["./sahaidachnyi.png", "./hero.png", "./player.png"];
    const heroSprite = new Image();
    let heroSpriteLoaded = false;
    let spriteRatio = HERO_ASPECT_RATIO;

    function tryLoadHeroSprite(index = 0) {
      if (index >= SPRITE_CANDIDATES.length) return;
      const testImg = new Image();
      testImg.onload = () => {
        if (testImg.naturalWidth > 0 && testImg.naturalHeight > 0) {
          spriteRatio = testImg.naturalWidth / testImg.naturalHeight;
          hero.w = Math.round(hero.h * spriteRatio);
          heroSprite.src = testImg.src;
          heroSpriteLoaded = true;
        }
      };
      testImg.onerror = () => {
        tryLoadHeroSprite(index + 1);
      };
      testImg.src = SPRITE_CANDIDATES[index];
    }

    let currentLevel = 1;
    let cameraX = 0;

    const input = {
      left: false,
      right: false
    };

    const hero = {
      x: 120,
      y: GROUND_Y - HERO_HEIGHT,
      w: HERO_WIDTH,
      h: HERO_HEIGHT,
      vx: 0,
      vy: 0,
      facing: 1, // 1 = праворуч, -1 = ліворуч
      jumpsUsed: 0,
      maxJumps: 2,
      hp: 5,
      score: 0,
      knives: 5,
      macesCollected: 0,
      totalMaces: 8,
      saberTimer: 0,
      invulnTimer: 0
    };

    let platforms = [];
    let pits = [];
    let maces = [];
    let projectiles = [];
    let enemies = [];

    const LEVELS = {
      1: {
        name: "Кам'янець",
        skyTop: "#5aa5e8",
        skyBottom: "#9fd0f7",
        hillColor: "#dfb24b",
        hillStripe: "#c89934",
        castleColor: "#a7acb0",
        roofColor: "#b84438",
        platforms: [
          { x: 260, y: 315, w: 170, h: 24 },
          { x: 640, y: 270, w: 180, h: 24 },
          { x: 1080, y: 300, w: 190, h: 24 },
          { x: 1520, y: 255, w: 185, h: 24 }
        ],
        pits: [
          { x: 470, w: 110 },
          { x: 1320, w: 120 }
        ],
        maceSpots: [
          { x: 340, y: 272 },
          { x: 730, y: 227 },
          { x: 930, y: 388 },
          { x: 1170, y: 257 },
          { x: 1460, y: 388 },
          { x: 1610, y: 212 },
          { x: 1820, y: 388 },
          { x: 2020, y: 388 }
        ],
        enemySpots: [
          { x: 860, y: GROUND_Y - 46, minX: 780, maxX: 1020 },
          { x: 1740, y: GROUND_Y - 46, minX: 1680, maxX: 1960 }
        ]
      },
      2: {
        name: "Хотин",
        skyTop: "#4c8fd1",
        skyBottom: "#98c6ee",
        hillColor: "#d3a33f",
        hillStripe: "#b98a2b",
        castleColor: "#949b9f",
        roofColor: "#9f372d",
        platforms: [
          { x: 240, y: 300, w: 165, h: 24 },
          { x: 580, y: 245, w: 175, h: 24 },
          { x: 960, y: 285, w: 185, h: 24 },
          { x: 1380, y: 230, w: 190, h: 24 },
          { x: 1760, y: 290, w: 175, h: 24 }
        ],
        pits: [
          { x: 440, w: 115 },
          { x: 850, w: 110 },
          { x: 1610, w: 120 }
        ],
        maceSpots: [
          { x: 320, y: 257 },
          { x: 665, y: 202 },
          { x: 750, y: 388 },
          { x: 1050, y: 242 },
          { x: 1240, y: 388 },
          { x: 1470, y: 187 },
          { x: 1845, y: 247 },
          { x: 2060, y: 388 }
        ],
        enemySpots: [
          { x: 720, y: GROUND_Y - 46, minX: 620, maxX: 820 },
          { x: 1220, y: GROUND_Y - 46, minX: 1140, maxX: 1350 },
          { x: 1920, y: GROUND_Y - 46, minX: 1800, maxX: 2120 }
        ]
      }
    };

    function loadLevel(lvlNum) {
      currentLevel = lvlNum;
      const cfg = LEVELS[lvlNum];

      document.getElementById("btnLvl1").classList.toggle("active", lvlNum === 1);
      document.getElementById("btnLvl2").classList.toggle("active", lvlNum === 2);

      const activeRatio = heroSpriteLoaded ? spriteRatio : HERO_ASPECT_RATIO;
      hero.h = HERO_HEIGHT;
      hero.w = Math.round(hero.h * activeRatio);
      hero.x = 120;
      hero.y = GROUND_Y - hero.h;
      hero.vx = 0;
      hero.vy = 0;
      hero.facing = 1;
      hero.jumpsUsed = 0;
      hero.hp = 5;
      hero.score = 0;
      hero.knives = 5;
      hero.macesCollected = 0;
      hero.totalMaces = cfg.maceSpots.length;
      hero.saberTimer = 0;
      hero.invulnTimer = 0;
      cameraX = 0;

      platforms = cfg.platforms.map(p => ({ ...p }));
      pits = cfg.pits.map(p => ({ ...p }));
      maces = cfg.maceSpots.map((m, idx) => ({ ...m, id: idx, taken: false }));
      projectiles = [];
      enemies = cfg.enemySpots.map((e, idx) => ({
        id: idx,
        x: e.x,
        y: e.y,
        w: 44,
        h: 46,
        vx: 85,
        minX: e.minX,
        maxX: e.maxX,
        alive: true
      }));

      updateHud();
    }

    function setLevel(lvlNum) {
      loadLevel(lvlNum);
    }

    function updateHud() {
      document.getElementById("statMaces").textContent = `🔱 ${hero.macesCollected}/${hero.totalMaces}`;
      document.getElementById("statKnives").textContent = `🗡️ ${hero.knives}`;
      document.getElementById("statHp").textContent = `❤️ ${hero.hp}`;
      document.getElementById("statScore").textContent = `⭐ ${hero.score}`;
    }

    function triggerJump() {
      if (hero.jumpsUsed < hero.maxJumps) {
        hero.vy = hero.jumpsUsed === 0 ? -620 : -560;
        hero.jumpsUsed += 1;
      }
    }

    function triggerSaber() {
      if (hero.saberTimer <= 0) {
        hero.saberTimer = 0.24;
        const reachX = hero.facing === 1 ? hero.x + hero.w : hero.x - 56;
        const hitBox = { x: reachX, y: hero.y + 12, w: 56, h: hero.h - 20 };
        enemies.forEach(en => {
          if (en.alive && rectsOverlap(hitBox, en)) {
            en.alive = false;
            hero.score += 150;
            updateHud();
          }
        });
      }
    }

    function triggerKnife() {
      if (hero.knives > 0) {
        hero.knives -= 1;
        projectiles.push({
          x: hero.facing === 1 ? hero.x + hero.w + 4 : hero.x - 24,
          y: hero.y + hero.h * 0.45,
          w: 22,
          h: 8,
          vx: hero.facing * 640,
          alive: true
        });
        updateHud();
      }
    }

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function isOverPit(xCenter) {
      return pits.some(p => xCenter > p.x && xCenter < p.x + p.w);
    }

    function update(dt) {
      const moveSpeed = 310;
      if (input.left && !input.right) {
        hero.vx = -moveSpeed;
        hero.facing = -1;
      } else if (input.right && !input.left) {
        hero.vx = moveSpeed;
        hero.facing = 1;
      } else {
        hero.vx = 0;
      }

      if (hero.saberTimer > 0) hero.saberTimer = Math.max(0, hero.saberTimer - dt);
      if (hero.invulnTimer > 0) hero.invulnTimer = Math.max(0, hero.invulnTimer - dt);

      hero.x += hero.vx * dt;
      hero.x = Math.max(20, Math.min(WORLD_WIDTH - hero.w - 20, hero.x));

      const prevBottom = hero.y + hero.h;
      hero.vy += GRAVITY * dt;
      hero.y += hero.vy * dt;

      let landed = false;

      if (hero.vy >= 0) {
        for (const p of platforms) {
          const withinX = hero.x + hero.w * 0.78 > p.x && hero.x + hero.w * 0.22 < p.x + p.w;
          const crossedTop = prevBottom <= p.y + 8 && hero.y + hero.h >= p.y;
          if (withinX && crossedTop) {
            hero.y = p.y - hero.h;
            hero.vy = 0;
            hero.jumpsUsed = 0;
            landed = true;
            break;
          }
        }
      }

      if (!landed && hero.vy >= 0) {
        const centerX = hero.x + hero.w * 0.5;
        if (!isOverPit(centerX) && hero.y + hero.h >= GROUND_Y) {
          hero.y = GROUND_Y - hero.h;
          hero.vy = 0;
          hero.jumpsUsed = 0;
          landed = true;
        }
      }

      if (hero.y > VIEW_HEIGHT + 80) {
        hero.hp = Math.max(1, hero.hp - 1);
        hero.x = 120;
        hero.y = GROUND_Y - hero.h;
        hero.vy = 0;
        hero.jumpsUsed = 0;
        updateHud();
      }

      maces.forEach(m => {
        if (!m.taken) {
          const mBox = { x: m.x - 16, y: m.y - 16, w: 32, h: 32 };
          if (rectsOverlap(hero, mBox)) {
            m.taken = true;
            hero.macesCollected += 1;
            hero.score += 100;
            updateHud();
          }
        }
      });

      projectiles.forEach(pr => {
        if (!pr.alive) return;
        pr.x += pr.vx * dt;
        if (pr.x < -60 || pr.x > WORLD_WIDTH + 60) {
          pr.alive = false;
          return;
        }
        enemies.forEach(en => {
          if (en.alive && rectsOverlap(pr, en)) {
            en.alive = false;
            pr.alive = false;
            hero.score += 150;
            updateHud();
          }
        });
      });

      enemies.forEach(en => {
        if (!en.alive) return;
        en.x += en.vx * dt;
        if (en.x <= en.minX) {
          en.x = en.minX;
          en.vx = Math.abs(en.vx);
        } else if (en.x + en.w >= en.maxX) {
          en.x = en.maxX - en.w;
          en.vx = -Math.abs(en.vx);
        }

        if (hero.invulnTimer <= 0 && rectsOverlap(hero, en)) {
          hero.hp = Math.max(1, hero.hp - 1);
          hero.invulnTimer = 1.0;
          hero.vy = -340;
          updateHud();
        }
      });

      const targetCam = hero.x - VIEW_WIDTH * 0.35;
      cameraX = Math.max(0, Math.min(WORLD_WIDTH - VIEW_WIDTH, targetCam));
    }

    function drawBackground(cfg) {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      skyGrad.addColorStop(0, cfg.skyTop);
      skyGrad.addColorStop(1, cfg.skyBottom);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

      const sunX = 740 - cameraX * 0.08;
      const sunY = 92;
      ctx.fillStyle = "rgba(255, 232, 145, 0.35)";
      ctx.beginPath();
      ctx.arc(sunX, sunY, 54, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffe066";
      ctx.beginPath();
      ctx.arc(sunX, sunY, 36, 0, Math.PI * 2);
      ctx.fill();

      const clouds = [180, 430, 690, 980, 1290];
      clouds.forEach((cx, idx) => {
        const x = cx - cameraX * 0.22;
        const y = 76 + (idx % 2) * 18;
        ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, Math.PI * 2);
        ctx.arc(x + 20, y - 6, 26, 0, Math.PI * 2);
        ctx.arc(x + 44, y, 20, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.save();
      ctx.translate(-cameraX * 0.45, 0);
      ctx.fillStyle = cfg.hillColor;
      ctx.beginPath();
      ctx.moveTo(-100, GROUND_Y);
      ctx.quadraticCurveTo(550, 265, 1250, 320);
      ctx.quadraticCurveTo(1850, 350, 2500, 300);
      ctx.lineTo(2500, GROUND_Y);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = cfg.hillStripe;
      ctx.lineWidth = 2;
      for (let sx = 60; sx < 2300; sx += 38) {
        ctx.beginPath();
        ctx.moveTo(sx, 335);
        ctx.lineTo(sx + 10, 355);
        ctx.stroke();
      }
      ctx.restore();

      const castles = [210, 980, 1680];
      castles.forEach(bx => {
        const cx = bx - cameraX * 0.65;
        const baseY = 230;
        ctx.fillStyle = cfg.castleColor;
        ctx.fillRect(cx, baseY, 130, 115);

        [0, 48, 96].forEach(offset => {
          ctx.fillStyle = cfg.castleColor;
          ctx.fillRect(cx + offset, baseY - 26, 34, 26);
          ctx.fillStyle = cfg.roofColor;
          ctx.beginPath();
          ctx.moveTo(cx + offset - 4, baseY - 26);
          ctx.lineTo(cx + offset + 17, baseY - 48);
          ctx.lineTo(cx + offset + 38, baseY - 26);
          ctx.closePath();
          ctx.fill();
        });
      });

      const cottages = [150, 560, 890, 1280, 1620, 1980];
      cottages.forEach(hx => {
        const x = hx - cameraX;
        const y = GROUND_Y - 76;
        ctx.fillStyle = "#f7f3e8";
        ctx.fillRect(x, y, 106, 76);

        ctx.fillStyle = "#7c4a27";
        ctx.fillRect(x + 44, y + 34, 18, 42);
        ctx.fillStyle = "#5b9bd5";
        ctx.fillRect(x + 14, y + 20, 18, 18);
        ctx.fillRect(x + 74, y + 20, 18, 18);

        ctx.fillStyle = "#dfb148";
        ctx.beginPath();
        ctx.moveTo(x - 10, y + 4);
        ctx.quadraticCurveTo(x + 53, y - 28, x + 116, y + 4);
        ctx.closePath();
        ctx.fill();
      });
    }

    function drawHero() {
      ctx.save();
      const centerX = hero.x + hero.w / 2;
      const centerY = hero.y + hero.h / 2;
      ctx.translate(centerX, centerY);
      // Дзеркальний поворот по горизонталі зі збереженням пропорцій (scaleX = ±1, scaleY = 1)
      ctx.scale(hero.facing, 1);

      if (hero.invulnTimer > 0 && Math.floor(hero.invulnTimer * 16) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }

      if (heroSpriteLoaded) {
        ctx.drawImage(heroSprite, -hero.w / 2, -hero.h / 2, hero.w, hero.h);
      } else {
        const hw = hero.w;
        const hh = hero.h;
        const left = -hw / 2;
        const top = -hh / 2;

        ctx.fillStyle = "#b82525";
        ctx.fillRect(left + hw * 0.16, top + hh * 0.56, hw * 0.68, hh * 0.30);

        ctx.fillStyle = "#3b2314";
        ctx.fillRect(left + hw * 0.22, top + hh * 0.84, hw * 0.20, hh * 0.16);
        ctx.fillRect(left + hw * 0.58, top + hh * 0.84, hw * 0.20, hh * 0.16);

        ctx.fillStyle = "#f5efe0";
        ctx.fillRect(left + hw * 0.24, top + hh * 0.28, hw * 0.52, hh * 0.30);

        ctx.fillStyle = "#d4a038";
        ctx.fillRect(left + hw * 0.22, top + hh * 0.52, hw * 0.56, hh * 0.07);

        ctx.fillStyle = "#e8be96";
        ctx.beginPath();
        ctx.arc(0, top + hh * 0.18, hw * 0.21, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#3d2817";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(left + hw * 0.30, top + hh * 0.12);
        ctx.quadraticCurveTo(left - hw * 0.12, top + hh * 0.04, left - hw * 0.06, top + hh * 0.24);
        ctx.stroke();

        ctx.fillStyle = "#1d1d1d";
        ctx.beginPath();
        ctx.arc(hw * 0.09, top + hh * 0.16, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Шабля в руці у напрямку погляду (+X після scale(hero.facing, 1))
      ctx.strokeStyle = "#dce8f2";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(hero.w * 0.25, -hero.h * 0.04);
      if (hero.saberTimer > 0) {
        ctx.lineTo(hero.w * 0.92, -hero.h * 0.34);
      } else {
        ctx.lineTo(hero.w * 0.75, -hero.h * 0.15);
      }
      ctx.stroke();

      ctx.restore();
    }

    function drawWorld() {
      const cfg = LEVELS[currentLevel];
      drawBackground(cfg);

      ctx.save();
      ctx.translate(-cameraX, 0);

      let cursorX = 0;
      const sortedPits = [...pits].sort((a, b) => a.x - b.x);
      for (const pit of sortedPits) {
        if (pit.x > cursorX) {
          drawGroundSegment(cursorX, pit.x - cursorX);
        }
        cursorX = pit.x + pit.w;
      }
      if (cursorX < WORLD_WIDTH) {
        drawGroundSegment(cursorX, WORLD_WIDTH - cursorX);
      }

      platforms.forEach(p => {
        ctx.fillStyle = "#7a5230";
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "#4fa83d";
        ctx.fillRect(p.x, p.y - 5, p.w, 8);
        ctx.strokeStyle = "#d9a74a";
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
      });

      maces.forEach(m => {
        if (m.taken) return;
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.strokeStyle = "#f2c14e";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 14);
        ctx.lineTo(0, -12);
        ctx.moveTo(-10, -4);
        ctx.quadraticCurveTo(0, 6, 10, -4);
        ctx.moveTo(-8, -10);
        ctx.lineTo(8, -10);
        ctx.stroke();
        ctx.restore();
      });

      projectiles.forEach(pr => {
        if (!pr.alive) return;
        ctx.fillStyle = "#d9e6f2";
        ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
        ctx.fillStyle = "#8c4a27";
        ctx.fillRect(pr.x + (pr.vx > 0 ? -6 : pr.w), pr.y - 1, 6, pr.h + 2);
      });

      enemies.forEach(en => {
        if (!en.alive) return;
        ctx.fillStyle = "#8c2d2d";
        ctx.fillRect(en.x, en.y, en.w, en.h);
        ctx.fillStyle = "#f2c14e";
        ctx.fillRect(en.x + 6, en.y - 6, en.w - 12, 8);
      });

      drawHero();
      ctx.restore();
    }

    function drawGroundSegment(x, width) {
      ctx.fillStyle = "#459e34";
      ctx.fillRect(x, GROUND_Y - 8, width, 12);
      ctx.fillStyle = "#5a3d24";
      ctx.fillRect(x, GROUND_Y + 4, width, VIEW_HEIGHT - GROUND_Y);
    }

    function bindHoldButton(btnId, keyName) {
      const el = document.getElementById(btnId);
      const press = (e) => {
        e.preventDefault();
        input[keyName] = true;
        el.classList.add("pressed");
      };
      const release = (e) => {
        e.preventDefault();
        input[keyName] = false;
        el.classList.remove("pressed");
      };
      el.addEventListener("pointerdown", press);
      el.addEventListener("pointerup", release);
      el.addEventListener("pointerleave", release);
      el.addEventListener("pointercancel", release);
    }

    bindHoldButton("btnLeft", "left");
    bindHoldButton("btnRight", "right");

    document.getElementById("btnJump").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      triggerJump();
    });
    document.getElementById("btnSaber").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      triggerSaber();
    });
    document.getElementById("btnKnife").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      triggerKnife();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") input.left = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") input.right = true;
      if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") {
        e.preventDefault();
        triggerJump();
      }
      if (e.code === "KeyJ" || e.code === "KeyZ") {
        triggerSaber();
      }
      if (e.code === "KeyK" || e.code === "KeyX" || e.code === "Enter") {
        triggerKnife();
      }
      if (e.code === "KeyR") {
        loadLevel(currentLevel);
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") input.left = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") input.right = false;
    });

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      drawWorld();
      requestAnimationFrame(loop);
    }

    tryLoadHeroSprite(0);
    loadLevel(1);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
